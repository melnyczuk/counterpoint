[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "counterpoint"
version = "0.1.0"
description = "Find samples in a winnower catalogue that sit harmonically against a chord, and suggest the shift and stretch to fit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "librosa>=0.10",
  "soundfile>=0.12",
  "fsspec>=2024.2",
  "mido>=1.3",
  "aalink>=0.2.3",
  "pedalboard>=0.9.26",
  "sounddevice>=0.5.6",
  "python-osc>=1.10.3",
  "python-rtmidi>=1.5.8",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
counterpoint = "counterpoint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/counterpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
